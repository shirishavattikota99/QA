
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Chat Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            height: 65px;
            background: #202b46;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 21px;
            font-weight: bold;
        }

        .app {
            max-width: 950px;
            height: calc(100vh - 65px);
            margin: auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            background: white;
            border: 1px solid #e0e4ed;
            border-radius: 14px;
            padding: 24px;
        }

        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 22px;
        }

        .label {
            font-size: 12px;
            color: #687386;
            margin-bottom: 7px;
        }

        .bubble {
            max-width: 85%;
            width: fit-content;
            padding: 13px 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border-radius: 14px;
        }

        .user {
            align-items: flex-end;
        }

        .user .bubble {
            background: #dce7ff;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            background: #f0f2f6;
            border-bottom-left-radius: 4px;
        }

        .composer {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #cfd5e0;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        #question:focus {
            border-color: #3658a5;
        }

        button {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: #3658a5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hint {
            font-size: 12px;
            color: #788195;
            margin-top: 9px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .app {
                padding: 10px;
            }

            #chat {
                padding: 14px;
            }

            .bubble {
                max-width: 95%;
            }

            button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <header>QA — AI Assistant</header>

    <main class="app">
        <div id="chat" aria-live="polite">
            <div class="message assistant">
                <div class="label">AI Assistant</div>
                <div class="bubble">Hello! How can I help you today?

You can ask follow-up questions, too.</div>
            </div>
        </div>

        <form id="chatForm" class="composer">
            <input
                id="question"
                type="text"
                placeholder="Ask anything..."
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">Send</button>
        </form>

        <div class="hint">
            Ask a question and continue the conversation naturally.
        </div>
    </main>

    <script>
        const API_URL = "/api/ai-prompt";

        const chat = document.getElementById("chat");
        const form = document.getElementById("chatForm");
        const input = document.getElementById("question");
        const sendButton = document.getElementById("sendButton");

        // Stores previous questions and answers during this session.
        const conversation = [];

        function addMessage(role, text) {
            const wrapper = document.createElement("div");
            wrapper.className = "message " + role;

            const label = document.createElement("div");
            label.className = "label";
            label.textContent =
                role === "user" ? "You" : "AI Assistant";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            wrapper.appendChild(label);
            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);

            chat.scrollTop = chat.scrollHeight;

            return bubble;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = input.value.trim();

            if (!question || sendButton.disabled) return;

            addMessage("user", question);
            input.value = "";
            sendButton.disabled = true;
            sendButton.textContent = "...";

            const answerBubble = addMessage(
                "assistant",
                "Thinking..."
            );

            try {
                // Send recent conversation turns as context.
                const previousConversation = conversation
                    .slice(-10)
                    .map(item =>
                        item.role.toUpperCase() + ": " + item.content
                    )
                    .join("\n\n");

                const prompt = previousConversation
                    ? "Previous conversation:\n" +
                      previousConversation +
                      "\n\nFollow-up question:\n" + question
                    : question;

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: prompt,

                        // These values are configured on the backend.
                        // Keep provider credentials out of the frontend.
                        aiApiKey: "",
                        partnerId: "4D5B30",
                        responseType: "Text",
                        aiLlm: "Gemini",
                        nodeEnv: "development",
                        appClient: "CORE"
                    })
                });

                const result = await response.json();

                if (!response.ok || result.success === false) {
                    throw new Error(
                        result.detail ||
                        result.data?.error ||
                        "Unable to get an answer."
                    );
                }

                const answer =
                    result.data?.response ??
                    result.response ??
                    "No answer received.";

                answerBubble.textContent =
                    typeof answer === "string"
                        ? answer
                        : JSON.stringify(answer, null, 2);

                conversation.push(
                    { role: "user", content: question },
                    {
                        role: "assistant",
                        content: answerBubble.textContent
                    }
                );

            } catch (error) {
                answerBubble.textContent =
                    "Sorry, something went wrong.\n" +
                    error.message;
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>
</html>
