<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-iq chat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f3f5f1;
    --panel: #ffffff;
    --ink: #1a2320;
    --muted: #5f6b64;
    --line: #d5dcd3;
    --accent: #1e5b4b;
    --accent-ink: #ffffff;
    --tint: #e4ede8;
    --danger: #9c3324;
    --danger-bg: #f8e8e4;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10161a;
      --panel: #182027;
      --ink: #e4e9e4;
      --muted: #96a39a;
      --line: #2b363e;
      --accent: #5fb89b;
      --accent-ink: #0c1a15;
      --tint: #1d2c2a;
      --danger: #eb9a8a;
      --danger-bg: #2d1d1a;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--font); }
  button, textarea, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100dvh; }

  /* ---- sidebar ---- */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 18px 16px 12px; display: grid; gap: 14px; }
  .brand { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .brand small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .chats { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .chat-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px 9px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .chat-item:hover { background: var(--paper); }
  .chat-item[aria-current="true"] { background: var(--tint); border-left-color: var(--accent); }
  .chat-item .t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .m { display: block; font-size: 13px; color: var(--muted); }
  .chats-note { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .side-foot { padding: 12px 16px; border-top: 1px solid var(--line); }
  .link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--ink); }

  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.55; cursor: default; }

  /* ---- main column ---- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .top h2 { margin: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu { display: none; background: none; border: 0; padding: 4px; cursor: pointer; border-radius: 6px; line-height: 0; }
  .thread { flex: 1; overflow-y: auto; padding: 28px 20px 12px; }
  .col { max-width: 720px; margin: 0 auto; }

  /* ---- empty state ---- */
  .empty { padding-top: 6vh; }
  .empty h3 { margin: 0 0 10px; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; max-width: 24ch; }
  .empty p { margin: 0 0 22px; color: var(--muted); max-width: 52ch; }
  .examples { display: grid; gap: 8px; max-width: 460px; }
  .example { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  .example:hover { border-color: var(--accent); }

  /* ---- the thread: questions hang on one line; filled dots mark follow-ups ---- */
  .turns { position: relative; padding-left: 30px; }
  .turns::before { content: ""; position: absolute; left: 6px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
  .turn { position: relative; margin-bottom: 30px; }
  .turn::before { content: ""; position: absolute; left: -30px; top: 13px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--muted); }
  .turn.linked::before { background: var(--accent); border-color: var(--accent); }
  .q { display: inline-block; max-width: 100%; background: var(--tint); border-radius: 10px; padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .understood { margin: 6px 2px 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .understood b { font-weight: 600; color: var(--accent); }
  .a { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; }
  .sources { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .query { margin-top: 10px; font-size: 13px; max-width: 100%; }
  .query summary { cursor: pointer; color: var(--muted); width: fit-content; border-radius: 4px; }
  .query summary:hover { color: var(--ink); }
  .qtools { display: flex; justify-content: flex-end; margin-top: 8px; }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .query pre { margin: 6px 0 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 320px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  .qerr { margin-top: 8px; color: var(--danger); overflow-wrap: anywhere; white-space: pre-wrap; }
  .qnote { margin-top: 8px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
  .qnone { margin: 8px 0 0; color: var(--muted); }
  .err { margin-top: 12px; background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 10px 14px; max-width: 68ch; overflow-wrap: anywhere; }
  .pending { margin-top: 12px; color: var(--muted); }
  .pending i { display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite both; }
  .pending i:nth-child(3) { animation-delay: 0.2s; }
  .pending i:nth-child(4) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pending i { animation: none; opacity: 0.6; } }

  /* ---- composer ---- */
  .composer { padding: 8px 20px 18px; }
  .box { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; }
  .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .box textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; padding: 6px 0; max-height: 160px; line-height: 1.5; }
  .box textarea::placeholder { color: var(--muted); }
  .hint { margin: 6px 4px 0; font-size: 12px; color: var(--muted); }

  /* ---- connection dialog ---- */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 22px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  dialog label { display: block; margin-bottom: 12px; font-weight: 500; font-size: 14px; }
  dialog label span { display: block; margin-top: 2px; font-weight: 400; font-size: 12px; color: var(--muted); }
  dialog input, dialog select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  .scrim { display: none; }

  /* ---- phones: sidebar becomes a drawer ---- */
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform 0.2s ease; }
    .side.open { transform: none; }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 10; }
    .menu { display: block; }
    .top, .thread, .composer { padding-left: 16px; padding-right: 16px; }
    .empty h3 { font-size: 24px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Chats">
    <div class="side-head">
      <h1 class="brand">C-iq <small>Ask questions about your casino data</small></h1>
      <button class="btn primary" id="newChat" type="button">New chat</button>
    </div>
    <nav class="chats" id="chats" aria-label="Saved chats"></nav>
    <div class="side-foot"><button class="link" id="openSettings" type="button">Connection settings</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="menu" id="menu" type="button" aria-label="Show saved chats">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h2 id="title">New chat</h2>
    </header>

    <section class="thread" id="thread" aria-live="polite">
      <div class="col" id="col"></div>
    </section>

    <form class="composer" id="composer">
      <div class="col">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Ask a question or follow up" aria-label="Your question"></textarea>
          <button class="btn primary" id="send" type="submit">Send</button>
        </div>
        <p class="hint">Enter sends. Shift+Enter adds a new line.</p>
      </div>
    </form>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Connection settings</h3>
    <p>Saved in this browser only.</p>
    <label>API key
      <input id="fKey" type="password" autocomplete="off" required>
    </label>
    <label>Partner ID
      <input id="fPartner" type="text" autocomplete="off" required>
    </label>
    <div class="row">
      <label>Environment
        <select id="fEnv"><option>local</option><option>development</option><option>production</option></select>
      </label>
      <label>Client
        <select id="fClient"><option>CORE</option><option>3XE</option></select>
      </label>
    </div>
    <label>Server address
      <input id="fBase" type="text" placeholder="Leave empty to use this server" autocomplete="off">
      <span>Only needed if this page is hosted somewhere else.</span>
    </label>
    <div class="actions">
      <button class="btn" type="button" id="cancelSettings">Cancel</button>
      <button class="btn primary" type="submit" id="saveSettings">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked: the page still works */ } },
  };

  const cfg = {
    apiBase: store.get("ciq.apiBase", ""),
    apiKey: store.get("ciq.apiKey", ""),
    partnerId: store.get("ciq.partnerId", ""),
    nodeEnv: store.get("ciq.nodeEnv", "local"),
    appClient: store.get("ciq.appClient", "CORE"),
  };
  let conversationId = newId();
  let busy = false;

  const col = $("#col"), thread = $("#thread"), input = $("#input"), sendBtn = $("#send");

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function url(path, params) {
    const q = new URLSearchParams({ apiKey: cfg.apiKey, ...params });
    return cfg.apiBase.replace(/\/+$/, "") + path + "?" + q;
  }

  function messageOf(json, status) {
    const d = json && json.detail;
    if (typeof d === "string") return d;
    if (d) return JSON.stringify(d);
    return "The server returned status " + status + ".";
  }

  async function getJson(path, params) {
    const res = await fetch(url(path, params));
    const json = await res.json().catch(() => null);
    if (!res.ok) throw new Error(res.status === 401 ? "The API key was not accepted." : messageOf(json, res.status));
    return json.data || [];
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function ago(iso) {
    const t = new Date(iso);
    if (isNaN(t)) return "";
    const s = (Date.now() - t) / 1000;
    if (s < 60) return "Just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 172800) return "Yesterday";
    return t.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  function sourceNames(list) {
    return (list || []).map((s) => (typeof s === "string" ? s.split(":").slice(1).join(":") || s : s.name)).filter(Boolean);
  }

  /* ---------- thread rendering ---------- */
  function turnsBox() {
    let box = col.querySelector(".turns");
    if (!box) {
      col.textContent = "";
      box = el("div", "turns");
      col.appendChild(box);
    }
    return box;
  }

  function setUnderstood(turn, text) {
    turn.classList.add("linked");
    const note = el("div", "understood");
    note.append(el("b", null, "Understood as: "), document.createTextNode(text));
    turn.querySelector(".q").after(note);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    t.remove();
    return Promise.resolve(ok);
  }

  // Collapsible "Generated query" panel: the query that ran, how many rows it returned, and any error.
  function queryNode(m) {
    if (!m || !(m.query || m.error || m.note)) return null;
    const d = el("details", "query");
    const bits = [];
    if (m.rows != null) bits.push(m.rows + (m.rows === 1 ? " row" : " rows"));
    if (m.ms != null) bits.push((m.ms / 1000).toFixed(1) + " s");
    d.appendChild(el("summary", null, "Generated query" + (bits.length ? " (" + bits.join(", ") + ")" : "")));
    if (m.query) {
      const tools = el("div", "qtools");
      const copy = el("button", "btn small", "Copy");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        copy.textContent = (await copyText(m.query)) ? "Copied" : "Select the text to copy";
        setTimeout(() => { copy.textContent = "Copy"; }, 1800);
      });
      tools.appendChild(copy);
      d.append(tools, el("pre", null, m.query));
    } else {
      d.appendChild(el("p", "qnone", "No query was built for this question."));
    }
    if (m.error) d.appendChild(el("div", "qerr", "Last error: " + m.error));
    if (m.note) d.appendChild(el("div", "qnote", "Model reply: " + m.note));
    return d;
  }

  function answerNodes(text, sources, meta) {
    const out = [el("div", "a", String(text || "").trim() || "The assistant returned an empty answer.")];
    const names = [...new Set(sourceNames(sources))];
    if (names.length) out.push(el("div", "sources", "Based on " + names.join(", ")));
    const q = queryNode(meta);
    if (q) out.push(q);
    return out;
  }

  function errorNode(message) {
    return el("div", "err", "Couldn't get an answer. " + message);
  }

  function addTurn(question) {
    const turn = el("div", "turn");
    turn.appendChild(el("div", "q", question));
    turnsBox().appendChild(turn);
    return turn;
  }

  function pendingNode() {
    const p = el("div", "pending", "Looking that up");
    for (let i = 0; i < 3; i++) p.appendChild(el("i"));
    return p;
  }

  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function showEmpty() {
    col.textContent = "";
    const box = el("div", "empty");
    box.appendChild(el("h3", null, "Ask about players, deposits, affiliates or coupons"));
    box.appendChild(el("p", null, "Follow-up questions work. After an answer, you can type something short like “and last month?” and it will be understood in context."));
    const list = el("div", "examples");
    ["Who are the top 5 affiliates by registered players?", "How many coupons were redeemed this month?", "Show net deposits for each month this year"].forEach((q) => {
      const b = el("button", "example", q);
      b.type = "button";
      b.addEventListener("click", () => send(q));
      list.appendChild(b);
    });
    box.appendChild(list);
    col.appendChild(box);
  }

  function renderSaved(turns) {
    col.textContent = "";
    turns.forEach((t) => {
      const turn = addTurn(t.question);
      if (t.resolved_question) setUnderstood(turn, t.resolved_question);
      if (t.success && t.answer != null) answerNodes(t.answer, t.sources, { query: t.generated_query, rows: t.row_count, ms: t.duration_ms }).forEach((n) => turn.appendChild(n));
      else turn.appendChild(errorNode(t.error || "No answer was saved."));
    });
    scrollDown();
  }

  /* ---------- saved chats ---------- */
  function setTitle(text) { $("#title").textContent = text || "New chat"; }

  function renderChats(rows) {
    const nav = $("#chats");
    nav.textContent = "";
    if (!rows.length) { nav.appendChild(el("div", "chats-note", "Your chats will appear here.")); return; }
    rows.forEach((c) => {
      const b = el("button", "chat-item");
      b.type = "button";
      b.setAttribute("aria-current", String(c.conversation_id === conversationId));
      b.append(el("span", "t", c.title || "Untitled chat"), el("span", "m", ago(c.updated_at) + (c.turns > 1 ? " – " + c.turns + " questions" : "")));
      b.addEventListener("click", () => openChat(c.conversation_id, c.title));
      nav.appendChild(b);
    });
  }

  async function refreshChats() {
    if (!cfg.apiKey || !cfg.partnerId) return [];
    try {
      const rows = await getJson("/api/ai-conversations", { partnerId: cfg.partnerId });
      renderChats(rows);
      return rows;
    } catch (e) {
      const nav = $("#chats");
      nav.textContent = "";
      nav.appendChild(el("div", "chats-note", "Couldn't load saved chats. " + e.message + " Check the connection settings."));
      return [];
    }
  }

  async function openChat(id, title) {
    if (busy) return;
    closeDrawer();
    try {
      const turns = await getJson("/api/ai-conversation", { partnerId: cfg.partnerId, conversationId: id });
      if (!turns.length) throw new Error("This chat has no saved questions.");
      conversationId = id;
      store.set("ciq.last", id);
      renderSaved(turns);
      setTitle(title || turns[0].question);
      refreshChats();
    } catch (e) {
      col.appendChild(errorNode(e.message));
    }
    input.focus();
  }

  function newChat() {
    if (busy) return;
    conversationId = newId();
    store.set("ciq.last", "");
    setTitle("New chat");
    showEmpty();
    closeDrawer();
    refreshChats();
    input.focus();
  }

  /* ---------- sending ---------- */
  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on;
    input.disabled = on;
  }

  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (!cfg.apiKey || !cfg.partnerId) { openSettings(); return; }

    setBusy(true);
    const first = !col.querySelector(".turns");
    const turn = addTurn(text);
    const pending = pendingNode();
    turn.appendChild(pending);
    input.value = "";
    autosize();
    scrollDown();
    if (first) setTitle(text);

    try {
      const res = await fetch(url("/api/ai-prompt", {}), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: text, aiApiKey: cfg.apiKey, partnerId: cfg.partnerId, responseType: "Text",
          aiLlm: "Gemini", nodeEnv: cfg.nodeEnv, appClient: cfg.appClient, conversationId,
        }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok) throw new Error(res.status === 401 ? "The API key was not accepted." : messageOf(json, res.status));
      if (!json || !json.success) throw new Error((json && json.data && json.data.error) || "No answer came back.");
      const d = json.data;
      pending.remove();
      if (d.resolvedQuestion) setUnderstood(turn, d.resolvedQuestion);
      answerNodes(d.response, d.sources, { query: d.generatedQuery, rows: d.rowCount, ms: d.durationMs, error: d.queryError, note: d.modelNote }).forEach((n) => turn.appendChild(n));
      store.set("ciq.last", conversationId);
      refreshChats();
    } catch (e) {
      pending.remove();
      turn.appendChild(errorNode(e.message));
      input.value = text; // keep the question so it can be sent again
      autosize();
    } finally {
      setBusy(false);
      scrollDown();
      input.focus();
    }
  }

  /* ---------- composer ---------- */
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  $("#newChat").addEventListener("click", newChat);

  /* ---------- drawer (phones) ---------- */
  const side = $("#side"), scrim = $("#scrim");
  function closeDrawer() { side.classList.remove("open"); scrim.classList.remove("show"); }
  $("#menu").addEventListener("click", () => { side.classList.add("open"); scrim.classList.add("show"); });
  scrim.addEventListener("click", closeDrawer);

  /* ---------- connection settings ---------- */
  const dlg = $("#settings");
  function openSettings() {
    $("#fKey").value = cfg.apiKey;
    $("#fPartner").value = cfg.partnerId;
    $("#fEnv").value = cfg.nodeEnv;
    $("#fClient").value = cfg.appClient;
    $("#fBase").value = cfg.apiBase;
    closeDrawer();
    dlg.showModal();
    $(cfg.apiKey ? "#fPartner" : "#fKey").focus();
  }
  $("#openSettings").addEventListener("click", openSettings);
  $("#cancelSettings").addEventListener("click", () => dlg.close());
  $("#settingsForm").addEventListener("submit", () => {
    cfg.apiKey = $("#fKey").value.trim();
    cfg.partnerId = $("#fPartner").value.trim();
    cfg.nodeEnv = $("#fEnv").value;
    cfg.appClient = $("#fClient").value;
    cfg.apiBase = $("#fBase").value.trim();
    store.set("ciq.apiKey", cfg.apiKey);
    store.set("ciq.partnerId", cfg.partnerId);
    store.set("ciq.nodeEnv", cfg.nodeEnv);
    store.set("ciq.appClient", cfg.appClient);
    store.set("ciq.apiBase", cfg.apiBase);
    refreshChats();
  });

  /* ---------- start ---------- */
  (async function start() {
    showEmpty();
    if (!cfg.apiKey || !cfg.partnerId) { openSettings(); return; }
    const rows = await refreshChats();
    const last = store.get("ciq.last", "");
    const match = rows.find((c) => c.conversation_id === last);
    if (match) openChat(match.conversation_id, match.title);
    else input.focus();
  })();
})();
</script>
</body>
</html>
